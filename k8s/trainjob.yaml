# Optional: Kubeflow Trainer v2 (TrainJob CRD). The NRP docs describe the v1
# TFJob/PyTorchJob operator, so v2 may not be installed. Check first:
#   kubectl get crd | grep trainjob
#   kubectl get clustertrainingruntime
# This manifest needs the torch-distributed runtime to exist.
#
# Two v2 limitations to be aware of:
#   - spec.trainer takes an env list but no envFrom, so the sft-env Secret cannot
#     be pulled in wholesale; the values below must be kept in sync with .env by hand.
#   - spec.trainer cannot declare volumeMounts either; mounting a PVC goes through
#     runtimePatches or a ClusterTrainingRuntime prepared by an admin.
# The default path is pytorchjob.yaml.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: qwen-sft
spec:
  runtimeRef:
    apiGroup: trainer.kubeflow.org
    kind: ClusterTrainingRuntime
    name: torch-distributed
  trainer:
    image: gitlab-registry.nrp-nautilus.io/YOUR_USER/context-comp-sft:latest
    numNodes: 1
    numProcPerNode: 2
    command:
      - bash
      - /workspace/src/entrypoint.sh
    env:
      - name: MODEL_NAME
        value: Qwen/Qwen3-1.7B
      - name: TRAIN_FILE
        value: /workspace/data/train.jsonl
      - name: OUTPUT_DIR
        value: /workspace/runs/qwen-sft
      - name: DEEPSPEED_CONFIG
        value: /workspace/configs/ds.json
      - name: MAX_SEQ_LEN
        value: "4096"
      - name: EPOCHS
        value: "2"
      - name: HF_HOME
        value: /workspace/.cache/huggingface
      - name: PYTORCH_CUDA_ALLOC_CONF
        value: expandable_segments:True
      # Pull single keys out of the Secret one by one:
      # - name: HF_TOKEN
      #   valueFrom:
      #     secretKeyRef: {name: sft-env, key: HF_TOKEN}
    resourcesPerNode:
      requests:
        nvidia.com/a40: 2
        cpu: "8"
        memory: 64Gi
      limits:
        nvidia.com/a40: 2
        cpu: "12"
        memory: 64Gi
