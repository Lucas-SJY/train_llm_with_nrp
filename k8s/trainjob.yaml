# Optional: Kubeflow Trainer v2 (TrainJob CRD). The NRP docs describe the v1
# TFJob/PyTorchJob operator, so v2 may not be installed. Check first:
#   kubectl get crd | grep trainjob
#   kubectl get clustertrainingruntime
# This manifest needs the torch-distributed runtime to exist.
#
# Note: spec.trainer cannot declare volumeMounts in v2. Mounting a PVC requires
# runtimePatches on the pod, or a ClusterTrainingRuntime prepared by an admin.
# So this file only fits runs that push results straight to HF / S3; the default
# path is pytorchjob.yaml.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: qwen-sft
spec:
  runtimeRef:
    apiGroup: trainer.kubeflow.org
    kind: ClusterTrainingRuntime
    name: torch-distributed
  trainer:
    image: gitlab-registry.nrp-nautilus.io/YOUR_USER/context-comp-sft:latest
    numNodes: 1
    numProcPerNode: 4
    command:
      - bash
      - /workspace/src/entrypoint.sh
      - --model
      - Qwen/Qwen3-8B
      - --train-file
      - /workspace/data/train.jsonl
      - --output-dir
      - /workspace/runs/qwen-sft
      - --max-seq-len
      - "4096"
      - --epochs
      - "2"
    env:
      - name: HF_HOME
        value: /workspace/.cache/huggingface
      - name: PYTORCH_CUDA_ALLOC_CONF
        value: expandable_segments:True
    resourcesPerNode:
      requests:
        nvidia.com/a40: 4
        cpu: "12"
        memory: 128Gi
      limits:
        nvidia.com/a40: 4
        cpu: "16"
        memory: 128Gi
