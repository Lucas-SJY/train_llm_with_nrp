# Holds the HF model cache and the checkpoints. Anything not written to a PVC is
# lost when the container restarts.
# CephFS supports ReadWriteMany (required for multi-node) and is faster on large
# files. Other options on this cluster: kubectl get storageclass
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-sft-data
spec:
  storageClassName: cephfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 300Gi
