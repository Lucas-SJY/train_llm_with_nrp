# Holds the HF model cache and the checkpoints. Anything not written to a PVC is
# lost when the container restarts.
#
# rook-ceph-block is RBD: block storage, good with the many small files a HF cache
# contains, and the class most volumes in this namespace already use. One pod at a
# time, which is all a single-GPU Job needs. Switch to rook-cephfs with
# ReadWriteMany if several pods ever have to mount this at once.
# List what the cluster offers: kubectl get storageclass
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-sft-data
spec:
  storageClassName: rook-ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
