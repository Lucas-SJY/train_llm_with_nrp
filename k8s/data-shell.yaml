# Throwaway pod for copying data into the PVC or pulling trained weights back out.
#   kubectl apply -f k8s/data-shell.yaml
#   kubectl cp data/train.jsonl data-shell:/data/train.jsonl
#   kubectl cp data-shell:/data/runs/qwen-sft ./qwen-sft
#   kubectl delete pod data-shell        # delete it right away, NRP forbids idle pods
apiVersion: v1
kind: Pod
metadata:
  name: data-shell
spec:
  containers:
    - name: shell
      image: alpine:3.20
      command: ["sh", "-c", "sleep 14400"]   # exits after 4h, never use sleep infinity
      resources:
        requests: {cpu: "1", memory: 2Gi}
        limits: {cpu: "2", memory: 4Gi}
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: qwen-sft-data
  restartPolicy: Never
