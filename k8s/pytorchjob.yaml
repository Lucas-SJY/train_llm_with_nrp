# Kubeflow Training Operator v1 (this is the version installed on NRP).
#
# Create the config Secret from .env first, then submit:
#   kubectl create secret generic sft-env --from-env-file=.env
#   kubectl apply -f k8s/pytorchjob.yaml
# Status: kubectl get pytorchjob qwen-sft
# Logs:   kubectl logs -f qwen-sft-master-0
# Delete: kubectl delete pytorchjob qwen-sft
#
# All model / training / key settings come from the sft-env Secret via envFrom,
# so this file only describes the hardware. Edit .env, re-create the secret,
# resubmit. Note that $(VAR) substitution in args does NOT see envFrom values,
# which is why there are no args here -- train_sft.py reads the env directly.
#
# Default setup: single node, 2x A40 (48G), full-parameter SFT of Qwen3-1.7B with
# plain DeepSpeed (ZeRO stage 0 = data parallel, every GPU holds a full copy).
# Bigger models do NOT fit at stage 0: an 8B model needs ~128GB per GPU for
# weights + grads + Adam states. See the memory table in the README.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: qwen-sft
spec:
  runPolicy:
    cleanPodPolicy: None      # keep pods after completion so logs stay readable
    backoffLimit: 3
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              # Same value as IMAGE in .env; k8s cannot read .env for this field.
              image: gitlab-registry.nrp-nautilus.io/YOUR_USER/context-comp-sft:latest
              imagePullPolicy: Always
              command: ["bash", "/workspace/src/entrypoint.sh"]
              envFrom:
                - secretRef:
                    name: sft-env
              resources:
                requests:
                  nvidia.com/a40: 2
                  cpu: "8"
                  memory: 64Gi
                  ephemeral-storage: 20Gi
                limits:
                  nvidia.com/a40: 2
                  cpu: "12"
                  memory: 64Gi
                  ephemeral-storage: 20Gi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: dshm            # NCCL and the dataloader need this; the 64MB default hangs
                  mountPath: /dev/shm
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: qwen-sft-data
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi

    # ---- Multi-node: uncomment the block below, replicas = total nodes - 1 ----
    # Keep the GPU count identical across pods; entrypoint.sh handles the rendezvous.
    # Note that stage 0 replicates the model on every GPU, so extra nodes buy
    # throughput, not capacity for a larger model.
    # Worker:
    #   replicas: 1
    #   restartPolicy: OnFailure
    #   template:
    #     spec:
    #       containers:
    #         - name: pytorch
    #           image: gitlab-registry.nrp-nautilus.io/YOUR_USER/context-comp-sft:latest
    #           imagePullPolicy: Always
    #           command: ["bash", "/workspace/src/entrypoint.sh"]
    #           envFrom:
    #             - secretRef: {name: sft-env}
    #           resources:
    #             requests: {nvidia.com/a40: 2, cpu: "8", memory: 64Gi, ephemeral-storage: 20Gi}
    #             limits:   {nvidia.com/a40: 2, cpu: "12", memory: 64Gi, ephemeral-storage: 20Gi}
    #           volumeMounts:
    #             - {name: data, mountPath: /data}
    #             - {name: dshm, mountPath: /dev/shm}
    #       volumes:
    #         - name: data
    #           persistentVolumeClaim: {claimName: qwen-sft-data}
    #         - name: dshm
    #           emptyDir: {medium: Memory, sizeLimit: 8Gi}
