# Kubeflow Training Operator v1（NRP 上装的就是这个版本）
# 提交： kubectl apply -f k8s/pytorchjob.yaml
# 状态： kubectl get pytorchjob qwen-sft
# 日志： kubectl logs -f qwen-sft-master-0
# 删除： kubectl delete pytorchjob qwen-sft
#
# 默认配置：单节点 4×A40（48G），Qwen 8B 全参 SFT + ZeRO-3，不做 offload。
# 改镜像 image: 那一行成你自己推上去的地址。
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: qwen-sft
spec:
  runPolicy:
    cleanPodPolicy: None      # 跑完保留 pod，方便看日志
    backoffLimit: 3
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: gitlab-registry.nrp-nautilus.io/YOUR_USER/context-comp-sft:latest
              imagePullPolicy: Always
              command: ["bash", "/workspace/src/entrypoint.sh"]
              args:
                - --model
                - $(MODEL_NAME)
                - --train-file
                - /workspace/data/train.jsonl
                - --eval-file
                - /workspace/data/val.jsonl
                - --output-dir
                - $(OUTPUT_DIR)
                - --max-seq-len
                - "4096"
                - --epochs
                - "2"
                - --micro-batch-size
                - "1"
                - --grad-accum
                - "8"
                - --lr
                - "1e-5"
              env:
                # ← 换成你要训的那个 checkpoint 的准确 HF repo id
                - name: MODEL_NAME
                  value: Qwen/Qwen3-8B
                - name: OUTPUT_DIR
                  value: /data/runs/qwen-sft
                - name: HF_HOME              # 模型缓存写到 PVC，别写进容器盘
                  value: /data/hf
                - name: NCCL_DEBUG
                  value: WARN
                - name: PYTORCH_CUDA_ALLOC_CONF
                  value: expandable_segments:True
                # 私有 / gated 模型才需要，先建 secret：
                # kubectl create secret generic hf-token --from-literal=token=hf_xxx
                # - name: HF_TOKEN
                #   valueFrom:
                #     secretKeyRef: {name: hf-token, key: token}
              resources:
                requests:
                  nvidia.com/a40: 4
                  cpu: "12"
                  memory: 128Gi
                  ephemeral-storage: 20Gi
                limits:
                  nvidia.com/a40: 4
                  cpu: "16"
                  memory: 128Gi
                  ephemeral-storage: 20Gi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: dshm            # NCCL/dataloader 需要，默认 64MB 会挂
                  mountPath: /dev/shm
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: qwen-sft-data
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi

    # ---- 多节点：把下面整段取消注释，replicas = 总节点数 - 1 ----
    # 每个 pod 的 GPU 数保持一致，entrypoint.sh 会自动组 rendezvous。
    # Worker:
    #   replicas: 1
    #   restartPolicy: OnFailure
    #   template:
    #     spec:
    #       containers:
    #         - name: pytorch
    #           image: gitlab-registry.nrp-nautilus.io/YOUR_USER/context-comp-sft:latest
    #           imagePullPolicy: Always
    #           command: ["bash", "/workspace/src/entrypoint.sh"]
    #           args: [...]   # 与 Master 完全一致
    #           env: [...]    # 与 Master 完全一致
    #           resources:
    #             requests: {nvidia.com/a40: 4, cpu: "12", memory: 128Gi, ephemeral-storage: 20Gi}
    #             limits:   {nvidia.com/a40: 4, cpu: "16", memory: 128Gi, ephemeral-storage: 20Gi}
    #           volumeMounts:
    #             - {name: data, mountPath: /data}
    #             - {name: dshm, mountPath: /dev/shm}
    #       volumes:
