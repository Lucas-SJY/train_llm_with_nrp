# Kubeflow Training Operator v1 (this is the version installed on NRP).
#
# Do not apply this file by hand -- ./run.sh renders ${IMAGE} and creates the two
# Secrets it depends on:
#   ./run.sh submit     build nothing, just (re)submit
#   ./run.sh            data + image + secrets + submit + logs
#
# All model / training / key settings come from the sft-env Secret via envFrom,
# so this file only describes the hardware. Edit .env, then `./run.sh secrets`
# and `./run.sh submit`. Note that $(VAR) substitution in args does NOT see
# envFrom values, which is why there are no args here -- train_sft.py reads the
# environment directly.
#
# Default setup: single node, 2x A40 (48G), full-parameter SFT of Qwen3-1.7B with
# plain DeepSpeed (ZeRO stage 0 = data parallel, every GPU holds a full copy).
# Bigger models do NOT fit at stage 0: an 8B model needs ~128GB per GPU for
# weights + grads + Adam states. See the memory table in the README.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: qwen-sft
spec:
  runPolicy:
    cleanPodPolicy: None      # keep pods after completion so logs stay readable
    backoffLimit: 3
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          # Private NRP registry: created by run.sh from NRP_REGISTRY_TOKEN.
          imagePullSecrets:
            - name: nrp-registry
          containers:
            - name: pytorch
              # Placeholder: run.sh substitutes IMAGE from .env before applying.
              # Applying this file directly with kubectl leaves it unresolved.
              image: ${IMAGE}
              imagePullPolicy: Always
              command: ["bash", "/workspace/src/entrypoint.sh"]
              envFrom:
                - secretRef:
                    name: sft-env
              resources:
                requests:
                  nvidia.com/a40: 2
                  cpu: "8"
                  memory: 64Gi
                  ephemeral-storage: 20Gi
                limits:
                  nvidia.com/a40: 2
                  cpu: "12"
                  memory: 64Gi
                  ephemeral-storage: 20Gi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: dshm            # NCCL and the dataloader need this; the 64MB default hangs
                  mountPath: /dev/shm
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: qwen-sft-data
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi

    # ---- Multi-node: uncomment the block below, replicas = total nodes - 1 ----
    # Keep the GPU count identical across pods; entrypoint.sh handles the rendezvous.
    # Note that stage 0 replicates the model on every GPU, so extra nodes buy
    # throughput, not capacity for a larger model.
    # Worker:
    #   replicas: 1
    #   restartPolicy: OnFailure
    #   template:
    #     spec:
    #       imagePullSecrets:
    #         - name: nrp-registry
    #       containers:
    #         - name: pytorch
    #           image: ${IMAGE}
    #           imagePullPolicy: Always
    #           command: ["bash", "/workspace/src/entrypoint.sh"]
    #           envFrom:
    #             - secretRef: {name: sft-env}
    #           resources:
    #             requests: {nvidia.com/a40: 2, cpu: "8", memory: 64Gi, ephemeral-storage: 20Gi}
    #             limits:   {nvidia.com/a40: 2, cpu: "12", memory: 64Gi, ephemeral-storage: 20Gi}
    #           volumeMounts:
    #             - {name: data, mountPath: /data}
    #             - {name: dshm, mountPath: /dev/shm}
    #       volumes:
    #         - name: data
    #           persistentVolumeClaim: {claimName: qwen-sft-data}
    #         - name: dshm
    #           emptyDir: {medium: Memory, sizeLimit: 8Gi}
