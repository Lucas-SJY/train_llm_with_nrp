# Kubeflow Training Operator v1 (this is the version installed on NRP).
# Submit: kubectl apply -f k8s/pytorchjob.yaml
# Status: kubectl get pytorchjob qwen-sft
# Logs:   kubectl logs -f qwen-sft-master-0
# Delete: kubectl delete pytorchjob qwen-sft
#
# Default setup: single node, 4x A40 (48G), full-parameter SFT of an 8B model with
# ZeRO-3 and no offload. Point image: at whatever you pushed.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: qwen-sft
spec:
  runPolicy:
    cleanPodPolicy: None      # keep pods after completion so logs stay readable
    backoffLimit: 3
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: gitlab-registry.nrp-nautilus.io/YOUR_USER/context-comp-sft:latest
              imagePullPolicy: Always
              command: ["bash", "/workspace/src/entrypoint.sh"]
              args:
                - --model
                - $(MODEL_NAME)
                - --train-file
                - /workspace/data/train.jsonl
                - --eval-file
                - /workspace/data/val.jsonl
                - --output-dir
                - $(OUTPUT_DIR)
                - --max-seq-len
                - "4096"
                - --epochs
                - "2"
                - --micro-batch-size
                - "1"
                - --grad-accum
                - "8"
                - --lr
                - "1e-5"
              env:
                # Replace with the exact HF repo id of the checkpoint you want to train.
                - name: MODEL_NAME
                  value: Qwen/Qwen3-8B
                - name: OUTPUT_DIR
                  value: /data/runs/qwen-sft
                - name: HF_HOME              # cache models on the PVC, not on the container disk
                  value: /data/hf
                - name: NCCL_DEBUG
                  value: WARN
                - name: PYTORCH_CUDA_ALLOC_CONF
                  value: expandable_segments:True
                # Only needed for private / gated models. Create the secret first:
                # kubectl create secret generic hf-token --from-literal=token=hf_xxx
                # - name: HF_TOKEN
                #   valueFrom:
                #     secretKeyRef: {name: hf-token, key: token}
              resources:
                requests:
                  nvidia.com/a40: 4
                  cpu: "12"
                  memory: 128Gi
                  ephemeral-storage: 20Gi
                limits:
                  nvidia.com/a40: 4
                  cpu: "16"
                  memory: 128Gi
                  ephemeral-storage: 20Gi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: dshm            # NCCL and the dataloader need this; the 64MB default hangs
                  mountPath: /dev/shm
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: qwen-sft-data
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi

    # ---- Multi-node: uncomment the block below, replicas = total nodes - 1 ----
    # Keep the GPU count identical across pods; entrypoint.sh handles the rendezvous.
    # Worker:
    #   replicas: 1
    #   restartPolicy: OnFailure
    #   template:
    #     spec:
    #       containers:
    #         - name: pytorch
    #           image: gitlab-registry.nrp-nautilus.io/YOUR_USER/context-comp-sft:latest
    #           imagePullPolicy: Always
    #           command: ["bash", "/workspace/src/entrypoint.sh"]
    #           args: [...]   # identical to Master
    #           env: [...]    # identical to Master
    #           resources:
    #             requests: {nvidia.com/a40: 4, cpu: "12", memory: 128Gi, ephemeral-storage: 20Gi}
    #             limits:   {nvidia.com/a40: 4, cpu: "16", memory: 128Gi, ephemeral-storage: 20Gi}
    #           volumeMounts:
    #             - {name: data, mountPath: /data}
    #             - {name: dshm, mountPath: /dev/shm}
    #       volumes:
