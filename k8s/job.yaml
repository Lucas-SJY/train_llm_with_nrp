# Plain Kubernetes Job: one pod, one GPU. No Kubeflow operator involved.
# NRP recommends Jobs over bare pods for any computation.
#
# Do not apply this file by hand -- ./run.sh renders ${IMAGE} and creates the two
# Secrets it depends on:
#   ./run.sh submit     just (re)submit
#   ./run.sh            data + image + secrets + submit + logs
#
# Model, hyperparameters and keys all arrive through the sft-env Secret (envFrom),
# so this file only describes the hardware.
#
# GPU choice: A100 rather than A40. A40 exists on only 3 nodes (12 cards) and one of
# them offers 2.5 cpu per GPU, so an 8-cpu request rarely fits -- that is what left
# the first attempt Pending. A100 spans 25 nodes (93 cards) and this namespace has a
# quota of 4. Check yours with `kubectl describe resourcequota`.
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen-sft
spec:
  backoffLimit: 2            # retry twice if the pod dies
  ttlSecondsAfterFinished: 604800   # clean up a week after it finishes
  template:
    spec:
      restartPolicy: Never
      # Private NRP registry: created by run.sh from NRP_REGISTRY_TOKEN.
      imagePullSecrets:
        - name: nrp-registry
      # No region constraint: take any node in the country with a free A100. The PVC
      # lives in the UCSD Ceph cluster, so a pod in us-central mounts it over the WAN
      # and writes checkpoints more slowly -- an acceptable trade for not queueing
      # behind the us-west A100s, which are usually all busy.
      #
      # 40GB A100s are excluded: with ZeRO-2 offload an 8B model still keeps bf16
      # weights (16.4G) and gradients (16.4G) resident, which leaves no room for
      # activations on a 40G card.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-80GB-PCIe
      containers:
        - name: trainer
          # Placeholder: run.sh substitutes IMAGE from .env before applying.
          image: ${IMAGE}
          imagePullPolicy: Always
          command: ["bash", "/workspace/src/entrypoint.sh"]
          envFrom:
            - secretRef:
                name: sft-env
          # Sized for 8B with ZeRO-2 optimizer offload. The host, not the GPU, holds
          # the optimizer: fp32 master weights + Adam m + Adam v = ~98G, plus an fp32
          # gradient buffer (~33G). 160Gi looked like enough headroom and got
          # OOMKilled at the first optimizer step -- pinned allocations peak higher
          # than the steady-state figure, and the safetensors page cache counts
          # against the same cgroup. 240Gi leaves real slack. The Adam step itself runs on the CPU, and
          # DeepSpeedCPUAdam scales with cores, so cpu trades optimizer speed against
          # how easily the pod schedules.
          # NRP policy: the cpu limit/request ratio may not exceed 1.2, and GPU
          # requests and limits must be equal. Keeping everything equal is simplest.
          resources:
            requests:
              nvidia.com/a100: 1
              cpu: "4"
              memory: 340Gi
              ephemeral-storage: 10Gi
            limits:
              nvidia.com/a100: 1
              cpu: "4"
              memory: 340Gi
              ephemeral-storage: 10Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dshm      # the 64MB default is too small for the dataloader
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qwen-sft-data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
